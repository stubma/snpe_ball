[snpe]
dsp_lib_dir = lib # 程序需要用到的一些动态库路径, 可以是绝对路径或者相对路径, 相对指的是相对于程序运行时的当前路径
model_path = ballspotting_woGSM_part1.dlc # 可以是绝对路径或者相对路径, 相对指的是相对于程序运行时的当前路径

[input]
video_path = rewoo_full.mp4 # 可以是绝对路径或者相对路径, 相对指的是相对于程序运行时的当前路径
video_codec = c2.qti.avc.decoder # 视频的解码器, 一般这个不需要改, 除非板子上没这个解码器
video_width = 7600 # 视频原始宽度, 由于视频的元数据可能有错误, 所以从元数据中读大小不保险, 这里就直接配一下好了
video_height = 2160 # 视频原始高度, 由于视频的元数据可能有错误, 所以从元数据中读大小不保险, 这里就直接配一下好了
left_goalnet_points = 1167,438,1386,426,1168,543,1381,521 # 左边球网四个角的坐标, 按照x1,y1,x2,y2,x3,y3,x4,y4的格式排列

[dump]
enable = 0 # 1表示打开视频帧导出功能, 这样会把解码后的结果导出为文件保存, 仅用于调试
format = raw # 可以为yuv, jpg, raw三种, yuv表示导出为yuv格式全尺寸图片, jpg表示导出为jpg格式全尺寸图片, raw表示导出为纯rgb格式的模型输入文件, 尺寸由模型的输入大小决定
folder = decode_output # 导出目录, 可以为相对或者绝对路径, 相对指的是相对于程序运行时的当前路径
from = 1 # 从第几帧开始导出, 第一帧是1. 如果你不想导出所有帧, 可以用from和to来控制导出帧范围
to = -1 # 导出到第几帧(inclusive), -1表示导出到最后一帧